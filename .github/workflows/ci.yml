name: Validate and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test offline behavior and CLI
        run: python -m unittest discover -s tests -v
      - name: Validate registry and export only reviewed exclusions
        run: |
          python -m aisafety validate data/registry.jsonl
          python -m aisafety export data/registry.jsonl --out dist/blocklist.json
          python -m aisafety scan examples/corpus-manifest.jsonl --blocklist dist/blocklist.json
      - name: Check patch whitespace
        run: git diff --check
