[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safety-evidence"
version = "0.1.0"
description = "Offline agent risk triage and evidence-reviewed training-corpus exclusions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ai-safety-evidence = "aisafety.__main__:main"

[tool.setuptools.packages.find]
include = ["aisafety*"]
